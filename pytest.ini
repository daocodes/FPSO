[pytest]
testpaths = tests
markers =
    integration: tests that hit live WRDS and require credentials/network
    slow: end-to-end runs that take more than a few seconds
# CI contract: `pytest -m "not integration"` must pass with no network and no
# credentials. Everything in tests/unit runs against the synthetic panel.
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
